name: Manual Package Directory

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: '选择要打包的目录'
        required: true
        type: choice
        options:
          - radio
          - radio-covers
          - app
          # 如果以后有其他目录，继续在这里添加

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate directory exists
        run: |
          if [ ! -d "${{ inputs.target_dir }}" ]; then
            echo "错误：目录 ${{ inputs.target_dir }} 不存在"
            exit 1
          fi

      - name: Create zip
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          DIR="${{ inputs.target_dir }}"
          zip -r "${DIR}-${TIMESTAMP}.zip" "${DIR}/"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ inputs.target_dir }}
          path: ${{ inputs.target_dir }}-*.zip
          retention-days: 30
