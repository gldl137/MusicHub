<!-- 设置页面 -->
<div class="page" id="page-settings">
    <div style="padding: 2px 20px 20px;">
        <!-- 顶部标签导航 -->
        <div class="settings-tabs">
            <div class="settings-tab active" data-tab="general" onclick="switchSettingsTab('general')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 6.34L2.1 2.1m17.8 17.8l-4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.24-4.24l-4.24 4.24M6.34 6.34l-4.24-4.24"/></svg>
                常规
            </div>
            <div class="settings-tab" data-tab="download" onclick="switchSettingsTab('download')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                播放下载
            </div>
            <div class="settings-tab" data-tab="plugins" onclick="switchSettingsTab('plugins')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                MF 插件
            </div>
            <div class="settings-tab" data-tab="subscribe" onclick="switchSettingsTab('subscribe')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                订阅
            </div>
            <div class="settings-tab" data-tab="about" onclick="switchSettingsTab('about')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                关于
            </div>
        </div>

        <!-- 设置内容区域 -->
        <div class="settings-content" id="settings-content-container">
            <!-- 内容由 JS 动态生成 -->
        </div>
    </div>
</div>
