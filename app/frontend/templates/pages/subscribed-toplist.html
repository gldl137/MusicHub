<!-- 下载订阅页面 -->
<div class="page" id="page-subscribed-toplist">
    <div class="subscription-header">
        <!-- 筛选标签 -->
        <div class="subscription-filter-tabs" id="subscription-filter-tabs">
            <button class="filter-tab active" data-filter="all">全部订阅</button>
            <button class="filter-tab" data-filter="subscribing">订阅中</button>
            <button class="filter-tab" data-filter="completed">已完成</button>
            <button class="filter-tab" data-filter="toplist">排行榜</button>
            <button class="filter-tab" data-filter="playlist">热门歌单</button>
        </div>
    </div>
    <div id="subscribed-toplist-container">
        <div class="loading">
            <div class="spinner"></div>
        </div>
    </div>
</div>
