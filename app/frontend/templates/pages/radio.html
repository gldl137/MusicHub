<!-- 电台页面 -->
<div class="page" id="page-radio" style="height: 100%; display: flex; flex-direction: column; overflow: hidden;">
    <!-- 顶部维度 Tab：省市台 / 分类 / 网络台（右侧含导入封面图标按钮） -->
    <div id="radio-tabs" style="flex-shrink: 0; padding: 0 16px 0; display: flex; gap: 12px;"></div>
    <!-- 子菜单：当前维度下的具体省份/类别/网络源 -->
    <div id="radio-submenu" style="flex-shrink: 0; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px;"></div>
    <!-- 滚动内容区域：电台列表或子菜单选择提示 -->
    <div id="radio-content" style="flex: 1; overflow-y: auto;">
        <div class="empty-state" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100%;">
            <div class="empty-icon">📻</div>
            <div class="empty-text">电台加载中...</div>
        </div>
    </div>

    <style>
        .rs-dropdown-wrap { position: relative; }
        .rs-trigger {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-color); font-size: 14px;
            cursor: pointer; box-sizing: border-box; font-family: inherit;
            transition: border-color .15s;
        }
        .rs-trigger:hover { border-color: var(--primary-color); }
        .rs-trigger-arrow { color: var(--text-secondary); margin-left: 8px; font-size: 12px; }
        .rs-popup {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 8px; max-height: 220px; overflow-y: auto; z-index: 10;
            box-shadow: 0 6px 16px rgba(0,0,0,.35);
        }
        .rs-option {
            padding: 8px 12px; cursor: pointer; color: var(--text-color); font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .rs-option:last-child { border-bottom: none; }
        .rs-option:hover { background: rgba(127,127,127,0.18); }
        .rs-option.rs-option-custom { color: var(--primary-color); }
    </style>

    <!-- 新增 / 编辑电台弹窗 -->
    <div id="radio-station-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:2000; align-items:center; justify-content:center;" onclick="if(event.target===this)RadioModule.closeStationModal()">
        <div style="background:var(--surface-color); width:min(480px,92vw); border-radius:var(--radius-lg); padding:20px; max-height:90vh; overflow:auto; box-shadow:0 8px 30px rgba(0,0,0,.35);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 id="radio-station-modal-title" style="margin:0; font-size:16px; color:var(--text-color);">新增电台</h3>
                <button type="button" onclick="RadioModule.closeStationModal()" style="background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--text-secondary);">×</button>
            </div>

            <div style="margin-bottom:12px;">
                <label style="display:block; font-size:13px; margin-bottom:6px; color:var(--text-secondary);">省市台 <span style="opacity:.7;">（可选）</span></label>
                <div id="rs-province-container" class="rs-dropdown-wrap"></div>
                <input id="rs-province-custom" type="text" placeholder="自定义省市（留空则不选）" style="display:none; width:100%; margin-top:6px; padding:8px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color);">
            </div>

            <div style="margin-bottom:12px;">
                <label style="display:block; font-size:13px; margin-bottom:6px; color:var(--text-secondary);">分类 <span style="opacity:.7;">（可选）</span></label>
                <div id="rs-category-container" class="rs-dropdown-wrap"></div>
                <input id="rs-category-custom" type="text" placeholder="自定义分类（留空则不选）" style="display:none; width:100%; margin-top:6px; padding:8px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color);">
            </div>

            <div style="margin-bottom:12px;">
                <label style="display:block; font-size:13px; margin-bottom:6px; color:var(--text-secondary);">网络台 <span style="opacity:.7;">（可选）</span></label>
                <div id="rs-network-container" class="rs-dropdown-wrap"></div>
                <input id="rs-network-custom" type="text" placeholder="自定义网络台（留空则不选）" style="display:none; width:100%; margin-top:6px; padding:8px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color);">
            </div>

            <div style="margin-bottom:12px;">
                <label style="display:block; font-size:13px; margin-bottom:6px; color:var(--text-secondary);">名称 *</label>
                <input id="rs-name" type="text" placeholder="电台名称" style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color);">
            </div>

            <div style="margin-bottom:12px;">
                <label style="display:block; font-size:13px; margin-bottom:6px; color:var(--text-secondary);">播放地址 *</label>
                <input id="rs-url" type="text" placeholder="音频流地址，如 http(s)://.../live/xxx.m3u8" style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color);">
            </div>

            <div style="margin-bottom:16px;">
                <label style="display:block; font-size:13px; margin-bottom:6px; color:var(--text-secondary);">封面地址 <span style="opacity:.7;">（可选，留空则不下载）</span></label>
                <input id="rs-cover-url" type="text" placeholder="图片 http(s) 地址，保存时自动下载并按电台名重命名" style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color);" oninput="RadioModule.previewCoverUrl(this.value)">
                <img id="rs-cover-url-preview" style="display:none; width:64px; height:64px; object-fit:cover; border-radius:8px; margin-top:8px;">
            </div>

            <!-- 弹窗底部：取消 / 保存 -->
            <div style="display:flex; gap:12px; justify-content:flex-end; align-items:center; margin-top:4px;">
                <button type="button" onclick="RadioModule.closeStationModal()" style="padding:8px 16px; border-radius:8px; border:1px solid var(--border-color); background:transparent; color:var(--text-color); cursor:pointer;">取消</button>
                <button id="rs-submit" type="button" onclick="RadioModule.submitStation()" style="padding:8px 16px; border-radius:8px; border:none; background:var(--primary-color); color:#fff; cursor:pointer;">保存</button>
            </div>
        </div>
    </div>

    <!-- 卡片三点菜单（编辑 / 删除） -->
    <div id="radio-station-menu" style="display:none; position:fixed; z-index:2100; background:var(--surface-color); border:1px solid var(--border-color); border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.2); overflow:hidden; min-width:120px;">
        <button type="button" onclick="RadioModule.editStationFromMenu()" style="display:block; width:100%; text-align:left; padding:10px 16px; background:none; border:none; color:var(--text-color); cursor:pointer; font-size:14px;">✏️ 编辑</button>
        <button type="button" onclick="RadioModule.deleteStationFromMenu()" style="display:block; width:100%; text-align:left; padding:10px 16px; background:none; border:none; color:#ff4d4f; cursor:pointer; font-size:14px;">🗑️ 删除</button>
    </div>
</div>
